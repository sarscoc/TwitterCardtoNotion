<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Twitter Cards</title>
  <style>
    :root{color-scheme:light;--bg:#f6f6f4;--card:#fff;--text:#242424;--muted:#8a8a86;--line:#e6e6e2}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
    main{width:min(1180px,calc(100% - 32px));margin:48px auto 80px}
    header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}
    h1{font-size:25px;letter-spacing:.02em;margin:0}
    .note{margin:6px 0 0;color:var(--muted);font-size:13px}
    #count{font-size:12px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.025)}
    .thumb{display:block;width:100%;aspect-ratio:1200/630;object-fit:cover;background:#eee}
    .body{padding:14px}
    .name{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .actions{display:flex;gap:8px;margin-top:12px}
    button,a.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);font:inherit;font-size:12px;border-radius:7px;padding:7px 10px;text-decoration:none;cursor:pointer}
    button:hover,a.btn:hover{background:#f5f5f3}
    .empty{display:none;padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed #d6d6d0;border-radius:12px;background:#fff}
    @media(max-width:600px){main{width:min(100% - 22px,1180px);margin-top:28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.body{padding:10px}.actions{flex-direction:column}.actions>*{text-align:center}.note{max-width:270px}}
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>Twitter Cards</h1><p class="note">GitHubにカードを追加・差し替え・削除するだけ。</p></div>
    <span id="count"></span>
  </header>
  <section id="grid" class="grid"></section>
  <div id="empty" class="empty">まだカードがありません。</div>
</main>
<script>
/*
  カードを増やす時は cards の中に1件追加してください。
  image : リポジトリ内の画像ファイル名
  notion: 飛び先のNotion URL
  slug  : Xに貼るカードURL用の名前（cards/slug/）
*/
const cards = [
  {
    name: '出佳 甜瓜',
    image: '3.png',
    notion: 'https://sarsland.notion.site/be5cc5cfcd4e40d2bc0bfa913f9bfd75',
    slug: 'izuyoshi-tenka'
  }
];

const grid=document.querySelector('#grid');
const empty=document.querySelector('#empty');
const count=document.querySelector('#count');
const base=new URL('./',location.href);

function cardURL(c){return new URL(`cards/${c.slug}/`,base).href}
function copy(text,button){navigator.clipboard.writeText(text).then(()=>{const old=button.textContent;button.textContent='コピーしました';setTimeout(()=>button.textContent=old,1200)})}

for(const c of cards){
  const article=document.createElement('article');article.className='card';
  const img=document.createElement('img');img.className='thumb';img.src=c.image;img.alt=c.name;img.loading='lazy';
  const body=document.createElement('div');body.className='body';
  const name=document.createElement('div');name.className='name';name.textContent=c.name;
  const actions=document.createElement('div');actions.className='actions';
  const copyBtn=document.createElement('button');copyBtn.textContent='X用URLコピー';copyBtn.onclick=()=>copy(cardURL(c),copyBtn);
  const notion=document.createElement('a');notion.className='btn';notion.href=c.notion;notion.target='_blank';notion.rel='noopener';notion.textContent='Notion ↗';
  actions.append(copyBtn,notion);body.append(name,actions);article.append(img,body);grid.append(article);
}
count.textContent=`${cards.length} cards`;
empty.style.display=cards.length?'none':'block';
</script>
</body>
</html>
