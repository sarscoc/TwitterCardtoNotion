<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Twitter Cards</title><style>
:root{--bg:#f7f7f5;--card:#fff;--text:#252525;--muted:#858580;--line:#e2e2de;--soft:#f0f0ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}main{width:min(1280px,calc(100% - 30px));margin:36px auto 80px}button,a.btn,input,select{font:inherit}button,a.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;padding:8px 11px;font-size:12px;cursor:pointer;text-decoration:none}.primary{background:#242424;color:#fff;border-color:#242424}.head{display:flex;align-items:center;justify-content:space-between;gap:16px}.head h1{font-size:24px;margin:0}.sub{font-size:12px;color:var(--muted);margin:4px 0 0}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:24px 0 15px}.tabs{display:flex;gap:4px}.tabs button.active,.view button.active{background:#242424;color:#fff;border-color:#242424}.search{min-width:220px;flex:1;max-width:420px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff}.toolbar select{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}.view{display:flex;gap:4px;margin-left:auto}.count{font-size:12px;color:var(--muted);margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}.thumb{display:block;width:100%;aspect-ratio:1200/630;object-fit:cover;background:#eee}.body{padding:12px}.name{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.pill{font-size:10px;background:var(--soft);border-radius:99px;padding:3px 7px;color:#666}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.danger{color:#a22}.list{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.row{display:grid;grid-template-columns:82px minmax(180px,2fr) 100px minmax(120px,1fr) 110px 250px;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px}.row:last-child{border-bottom:0}.row.headrow{background:#fafaf8;color:var(--muted);font-size:11px}.mini{width:70px;aspect-ratio:1200/630;object-fit:cover;border-radius:5px;background:#eee}.rname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rtags{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:70px}dialog{border:0;padding:0;border-radius:14px;width:min(500px,calc(100% - 24px));box-shadow:0 20px 70px #0004}dialog::backdrop{background:#0005}.modal{padding:22px}.modal h2{font-size:18px;margin:0 0 16px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#555;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}.field textarea{min-height:65px;resize:vertical}.drop{border:1.5px dashed #bbb;border-radius:10px;padding:18px;text-align:center;color:#777;font-size:12px;cursor:pointer;background:#fafaf8}.drop.over{background:#efefeb;border-color:#555}.preview{display:none;width:100%;aspect-ratio:1200/630;object-fit:cover;border-radius:8px;margin-top:10px}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:18px}.status{min-height:18px;color:var(--muted);font-size:12px;margin-top:8px}.busy{opacity:.55;pointer-events:none}@media(max-width:850px){.row{grid-template-columns:70px 1fr auto}.row>*:nth-child(3),.row>*:nth-child(4),.row>*:nth-child(5){display:none}.row.headrow{display:none}.row>*:last-child{grid-column:2/4}.view{margin-left:0}}@media(max-width:600px){main{width:calc(100% - 20px);margin-top:22px}.head{align-items:flex-start}.grid{grid-template-columns:1fr 1fr;gap:9px}.body{padding:9px}.actions{display:grid}.toolbar{gap:6px}.search{order:5;min-width:100%;max-width:none}.row{grid-template-columns:58px 1fr}.row>*:last-child{grid-column:1/3}.mini{width:52px}}
</style></head><body><main><div class="head"><div><h1>Twitter Cards</h1><p class="sub">Notionへ飛ぶXカード</p></div><button class="primary" id="add">＋ カードを追加</button></div><div class="toolbar"><div class="tabs"><button data-type="all" class="active">すべて</button><button data-type="character">キャラ</button><button data-type="report">卓報告</button></div><input class="search" id="search" placeholder="名前・タグを検索"><select id="sort"><option value="updated">更新が新しい順</option><option value="created">作成が新しい順</option><option value="name">名前順</option></select><div class="view"><button id="gallery">▦</button><button id="list" class="active">☰</button></div></div><div class="count" id="count"></div><section id="content"></section></main>
<dialog id="dialog"><form class="modal" id="form"><h2 id="modalTitle">カードを追加</h2><div class="field"><label>画像</label><div class="drop" id="drop">画像をここにドラッグ＆ドロップ<br>またはクリックして選択<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></div><img class="preview" id="preview"></div><div class="field"><label>カード名</label><input id="name" required></div><div class="field"><label>種類</label><select id="type"><option value="character">キャラ</option><option value="report">卓報告</option></select></div><div class="field"><label>タグ（カンマ区切り）</label><input id="tags" placeholder="VOID, CoC, 2026"></div><div class="field"><label>Notion URL</label><input id="notion" type="url" required></div><div class="field"><label>説明（空欄でもOK）</label><textarea id="description"></textarea></div><div class="status" id="status"></div><div class="modal-actions"><button type="button" id="cancel">キャンセル</button><button class="primary" type="submit">保存</button></div></form></dialog>
<script>
const API='https://twitter-card-api.sarscoc.workers.dev';let cards=[],filter='all',view=localStorage.getItem('tc-view')||'list',editing=null,newFile=null;const $=s=>document.querySelector(s),content=$('#content'),dlg=$('#dialog'),form=$('#form'),drop=$('#drop'),file=$('#file'),preview=$('#preview');
function img(c){return new URL(c.imagePath,location.href).href+'?v='+encodeURIComponent(c.updatedAt||'')}function cardURL(c){return new URL('cards/'+c.id+'/',location.href).href}function typeName(t){return t==='report'?'卓報告':'キャラ'}function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}function visible(){const q=$('#search').value.trim().toLowerCase();let a=cards.filter(c=>(filter==='all'||c.type===filter)&&(!q||[c.name,...(c.tags||[])].join(' ').toLowerCase().includes(q)));const s=$('#sort').value;if(s==='name')a.sort((a,b)=>a.name.localeCompare(b.name,'ja'));else a.sort((a,b)=>String(b[s==='created'?'createdAt':'updatedAt']||'').localeCompare(String(a[s==='created'?'createdAt':'updatedAt']||'')));return a}
function actions(c){return `<button data-copy="${c.id}">X用URLコピー</button><a class="btn" href="${esc(c.notion)}" target="_blank" rel="noopener">Notion ↗</a><button data-edit="${c.id}">編集</button><button class="danger" data-del="${c.id}">削除</button>`}
function render(){const a=visible();$('#count').textContent=`${a.length} / ${cards.length} cards`;$('#gallery').classList.toggle('active',view==='gallery');$('#list').classList.toggle('active',view==='list');if(!a.length){content.innerHTML='<div class="empty">該当するカードがありません。</div>';return}if(view==='gallery'){content.innerHTML='<div class="grid">'+a.map(c=>`<article class="card"><img class="thumb" loading="lazy" src="${img(c)}"><div class="body"><div class="name">${esc(c.name)}</div><div class="meta"><span class="pill">${typeName(c.type)}</span>${(c.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div><div class="actions">${actions(c)}</div></div></article>`).join('')+'</div>'}else{content.innerHTML='<div class="list"><div class="row headrow"><span>画像</span><span>名前</span><span>種類</span><span>タグ</span><span>更新</span><span>操作</span></div>'+a.map(c=>`<div class="row"><img class="mini" loading="lazy" src="${img(c)}"><span class="rname">${esc(c.name)}</span><span>${typeName(c.type)}</span><span class="rtags">${esc((c.tags||[]).join(', '))}</span><span>${esc((c.updatedAt||'').slice(0,10))}</span><span class="actions">${actions(c)}</span></div>`).join('')+'</div>'}bind()}
function bind(){content.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const c=cards.find(x=>x.id===b.dataset.copy);await navigator.clipboard.writeText(cardURL(c));const o=b.textContent;b.textContent='コピーしました';setTimeout(()=>b.textContent=o,900)});content.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(cards.find(x=>x.id===b.dataset.edit)));content.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove(cards.find(x=>x.id===b.dataset.del)))}
async function load(){try{const r=await fetch('cards.json?t='+Date.now());cards=await r.json();render()}catch(e){content.innerHTML='<div class="empty">一覧を読み込めませんでした。</div>'}}
function setFile(f){if(!f||!f.type.startsWith('image/'))return;newFile=f;preview.src=URL.createObjectURL(f);preview.style.display='block'}drop.onclick=()=>file.click();file.onchange=()=>setFile(file.files[0]);['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));
function reset(){form.reset();editing=null;newFile=null;preview.style.display='none';$('#status').textContent=''}function openAdd(){reset();$('#modalTitle').textContent='カードを追加';dlg.showModal()}function openEdit(c){reset();editing=c;$('#modalTitle').textContent='カードを編集';$('#name').value=c.name;$('#type').value=c.type||'character';$('#tags').value=(c.tags||[]).join(', ');$('#notion').value=c.notion;$('#description').value=c.description||'';preview.src=img(c);preview.style.display='block';dlg.showModal()}function dataUrl(f){return new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}function extension(f){return (f.name.split('.').pop()||'png').toLowerCase()}
form.onsubmit=async e=>{e.preventDefault();if(!editing&&!newFile){$('#status').textContent='画像を選んでください。';return}form.classList.add('busy');$('#status').textContent='保存しています…';try{const body={id:editing?.id,name:$('#name').value.trim(),type:$('#type').value,tags:$('#tags').value.split(',').map(x=>x.trim()).filter(Boolean),notion:$('#notion').value.trim(),description:$('#description').value.trim()};if(newFile){body.imageBase64=await dataUrl(newFile);body.imageExtension=extension(newFile)}const r=await fetch(API+'/card',{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'保存できませんでした');dlg.close();await new Promise(r=>setTimeout(r,900));await load()}catch(e){$('#status').textContent='エラー：'+e.message}finally{form.classList.remove('busy')}};
async function remove(c){if(!confirm(`「${c.name}」を削除しますか？`))return;try{const r=await fetch(API+'/card',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:c.id})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'削除できませんでした');await new Promise(r=>setTimeout(r,800));await load()}catch(e){alert('エラー：'+e.message)}}
$('#add').onclick=openAdd;$('#cancel').onclick=()=>dlg.close();$('#search').oninput=render;$('#sort').onchange=render;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{filter=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));render()});$('#gallery').onclick=()=>{view='gallery';localStorage.setItem('tc-view',view);render()};$('#list').onclick=()=>{view='list';localStorage.setItem('tc-view',view);render()};load();
</script></body></html>
