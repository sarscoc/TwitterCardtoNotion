<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Twitter Cards</title>
<style>
:root{--bg:#f7f7f5;--text:#252525;--muted:#888883;--line:#e7e7e3;--soft:#f1f1ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}main{width:min(1380px,calc(100% - 28px));margin:30px auto 70px}button,a.btn,input,select{font:inherit}button,a.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:6px;padding:6px 9px;font-size:12px;cursor:pointer;text-decoration:none}.primary{background:#242424;color:#fff;border-color:#242424}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.head h1{font-size:21px;margin:0}.sub{font-size:11px;color:var(--muted);margin:2px 0 0}.toolbar{display:flex;align-items:center;gap:5px;margin:18px 0 10px;white-space:nowrap}.tabs,.view{display:flex;gap:2px}.tabs button,.view button{border-color:transparent;background:transparent;padding:6px 8px;color:#666}.tabs button.active,.view button.active{background:#e9e9e5;color:#222}.search{min-width:180px;flex:1;max-width:360px;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;margin-left:5px}.toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 7px;background:#fff;font-size:12px}.view{margin-left:auto}.count{font-size:11px;color:var(--muted);margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}.thumb{display:block;width:100%;aspect-ratio:1200/630;object-fit:cover;background:#eee}.body{padding:10px}.name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.pill{font-size:9px;background:var(--soft);border-radius:99px;padding:2px 6px;color:#666}.actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:9px}.danger{color:#a22}.list{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.row{height:43px;display:grid;grid-template-columns:52px minmax(150px,2fr) 62px minmax(90px,1fr) 72px 190px;align-items:center;gap:8px;padding:0 8px;border-bottom:1px solid var(--line);font-size:11px;min-width:700px}.row:last-child{border-bottom:0}.row.headrow{height:28px;background:#fafaf8;color:var(--muted);font-size:10px}.mini{width:44px;height:23px;object-fit:cover;border-radius:3px;background:#eee}.rname{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rtype{color:#666}.rtags,.rdate{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rowactions{display:flex;align-items:center;justify-content:flex-end;gap:10px;white-space:nowrap;flex-wrap:nowrap}.linkaction{appearance:none;border:0!important;background:transparent!important;padding:0!important;border-radius:0!important;font-size:11px!important;color:#555!important;text-decoration:none;cursor:pointer;white-space:nowrap}.linkaction:hover{color:#000!important;text-decoration:underline}.morewrap{position:relative;flex:none}.moremenu{display:none;position:absolute;right:0;top:20px;z-index:20;background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 7px 25px #0002;padding:4px;min-width:80px}.moremenu.open{display:block}.moremenu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:6px 8px;font-size:11px}.empty{text-align:center;color:var(--muted);padding:60px}.listscroll{overflow-x:auto}dialog{border:0;padding:0;border-radius:12px;width:min(500px,calc(100% - 24px));box-shadow:0 20px 70px #0004}dialog::backdrop{background:#0005}.modal{padding:21px}.modal h2{font-size:17px;margin:0 0 15px}.field{margin:11px 0}.field label{display:block;font-size:11px;color:#555;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px;background:#fff}.drop{border:1.5px dashed #bbb;border-radius:8px;padding:16px;text-align:center;color:#777;font-size:11px;cursor:pointer;background:#fafaf8}.drop.over{background:#efefeb;border-color:#555}.preview{display:none;width:100%;aspect-ratio:1200/630;object-fit:cover;border-radius:7px;margin-top:9px}.auto{font-size:10px;color:var(--muted);margin:8px 0 0}.modal-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:17px}.status{min-height:17px;color:var(--muted);font-size:11px;margin-top:7px}.busy{opacity:.55;pointer-events:none}@media(max-width:650px){main{width:calc(100% - 18px);margin-top:20px}.head h1{font-size:19px}.sub{display:none}.toolbar{overflow-x:auto;padding-bottom:3px}.search{min-width:150px}.grid{grid-template-columns:1fr 1fr;gap:8px}.body{padding:8px}.card .actions{display:grid}.row{height:40px}}
</style>
</head>
<body>
<main><div class="head"><div><h1>Twitter Cards</h1><p class="sub">Notionへ飛ぶXカード</p></div><button class="primary" id="add">＋ 追加</button></div><div class="toolbar"><div class="tabs"><button data-type="all" class="active">すべて</button><button data-type="character">キャラ</button><button data-type="report">卓報告</button></div><input class="search" id="search" placeholder="検索"><select id="sort"><option value="updated">更新順</option><option value="created">作成順</option><option value="name">名前順</option></select><div class="view"><button id="gallery" title="ギャラリー">▦</button><button id="list" class="active" title="リスト">☰</button></div></div><div class="count" id="count"></div><section id="content"></section></main>
<dialog id="dialog"><form class="modal" id="form"><h2 id="modalTitle">カードを追加</h2><div class="field"><label>画像</label><div class="drop" id="drop">画像をドラッグ＆ドロップ / クリックして選択<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></div><img class="preview" id="preview"></div><div class="field"><label>Notion URL</label><input id="notion" type="url" required placeholder="https://...notion.site/..."></div><div class="field"><label>種類</label><select id="type"><option value="character">キャラ</option><option value="report">卓報告</option></select></div><div class="field"><label>タグ（任意・カンマ区切り）</label><input id="tags" placeholder="VOID, CoC, 2026"></div><p class="auto">カード名・Xカードのタイトル/説明・ページタイトルはNotionから自動生成します。</p><div class="status" id="status"></div><div class="modal-actions"><button type="button" id="cancel">キャンセル</button><button class="primary" type="submit">保存</button></div></form></dialog>
<script>
const API='https://twitter-card-api.sarscoc.workers.dev';let cards=[],filter='all',view=localStorage.getItem('tc-view')||'list',editing=null,newFile=null;const $=s=>document.querySelector(s),content=$('#content'),dlg=$('#dialog'),form=$('#form'),drop=$('#drop'),file=$('#file'),preview=$('#preview');
function img(c){return new URL(c.imagePath,location.href).href+'?v='+encodeURIComponent(c.updatedAt||'')}function cardURL(c){return new URL('cards/'+c.id+'/',location.href).href}function typeName(t){return t==='report'?'卓報告':'キャラ'}function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}function shortDate(s){if(!s)return'—';const d=new Date(s);return isNaN(d)?String(s).slice(5,10):`${d.getMonth()+1}/${d.getDate()}`}function visible(){const q=$('#search').value.trim().toLowerCase();let a=cards.filter(c=>(filter==='all'||c.type===filter)&&(!q||[c.name,...(c.tags||[])].join(' ').toLowerCase().includes(q)));const s=$('#sort').value;if(s==='name')a.sort((a,b)=>a.name.localeCompare(b.name,'ja'));else a.sort((a,b)=>String(b[s==='created'?'createdAt':'updatedAt']||'').localeCompare(String(a[s==='created'?'createdAt':'updatedAt']||'')));return a}
function galleryActions(c){return `<button data-copy="${c.id}">URLコピー</button><a class="btn" href="${esc(c.notion)}" target="_blank" rel="noopener">Notion ↗</a><button data-edit="${c.id}">編集</button><button class="danger" data-del="${c.id}">削除</button>`}function rowActions(c){return `<span class="rowactions"><button class="linkaction" data-copy="${c.id}">URLコピー</button><a class="linkaction" href="${esc(c.notion)}" target="_blank" rel="noopener">↗</a><button class="linkaction" data-edit="${c.id}">編集</button><span class="morewrap"><button class="linkaction more" data-more="${c.id}">•••</button><span class="moremenu" data-menu="${c.id}"><button class="danger" data-del="${c.id}">削除</button></span></span></span>`}
function render(){const a=visible();$('#count').textContent=`${a.length} / ${cards.length}`;$('#gallery').classList.toggle('active',view==='gallery');$('#list').classList.toggle('active',view==='list');if(!a.length){content.innerHTML='<div class="empty">該当するカードがありません。</div>';return}if(view==='gallery'){content.innerHTML='<div class="grid">'+a.map(c=>`<article class="card"><img class="thumb" loading="lazy" src="${img(c)}"><div class="body"><div class="name">${esc(c.name)}</div><div class="meta"><span class="pill">${typeName(c.type)}</span>${(c.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div><div class="actions">${galleryActions(c)}</div></div></article>`).join('')+'</div>'}else{content.innerHTML='<div class="listscroll"><div class="list"><div class="row headrow"><span>画像</span><span>名前</span><span>種類</span><span>タグ</span><span>更新</span><span style="text-align:right">操作</span></div>'+a.map(c=>`<div class="row"><img class="mini" loading="lazy" src="${img(c)}"><span class="rname">${esc(c.name)}</span><span class="rtype">${typeName(c.type)}</span><span class="rtags">${esc((c.tags||[]).join(' · '))}</span><span class="rdate">${shortDate(c.updatedAt)}</span>${rowActions(c)}</div>`).join('')+'</div></div>'}bind()}
function bind(){content.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const c=cards.find(x=>x.id===b.dataset.copy);await navigator.clipboard.writeText(cardURL(c));const o=b.textContent;b.textContent='✓';setTimeout(()=>b.textContent=o,800)});content.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(cards.find(x=>x.id===b.dataset.edit)));content.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove(cards.find(x=>x.id===b.dataset.del)));content.querySelectorAll('[data-more]').forEach(b=>b.onclick=e=>{e.stopPropagation();const m=content.querySelector(`[data-menu="${b.dataset.more}"]`);content.querySelectorAll('.moremenu').forEach(x=>x!==m&&x.classList.remove('open'));m.classList.toggle('open')})}document.addEventListener('click',()=>document.querySelectorAll('.moremenu.open').forEach(x=>x.classList.remove('open')));
async function load(){try{const r=await fetch(API+'/card',{method:'GET',cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'一覧を読み込めませんでした');cards=Array.isArray(d.cards)?d.cards:[];render()}catch(e){content.innerHTML='<div class="empty">一覧を読み込めませんでした。<br>'+esc(e.message)+'</div>'}}
function setFile(f){if(!f||!f.type.startsWith('image/'))return;newFile=f;preview.src=URL.createObjectURL(f);preview.style.display='block'}drop.onclick=()=>file.click();file.onchange=()=>setFile(file.files[0]);['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));
function reset(){form.reset();editing=null;newFile=null;preview.style.display='none';$('#status').textContent=''}function openAdd(){reset();$('#modalTitle').textContent='カードを追加';dlg.showModal()}function openEdit(c){reset();editing=c;$('#modalTitle').textContent='カードを編集';$('#type').value=c.type||'character';$('#tags').value=(c.tags||[]).join(', ');$('#notion').value=c.notion;preview.src=img(c);preview.style.display='block';dlg.showModal()}function dataUrl(f){return new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}function extension(f){return(f.name.split('.').pop()||'png').toLowerCase()}
form.onsubmit=async e=>{e.preventDefault();if(!editing&&!newFile){$('#status').textContent='画像を選んでください。';return}const editingId=editing?.id||null;form.classList.add('busy');$('#status').textContent='Notionからタイトルを取得して保存しています…';try{const body={id:editingId,type:$('#type').value,tags:$('#tags').value.split(',').map(x=>x.trim()).filter(Boolean),notion:$('#notion').value.trim()};if(newFile){body.imageBase64=await dataUrl(newFile);body.imageExtension=extension(newFile)}const r=await fetch(API+'/card',{method:editingId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'保存できませんでした');const saved=d.card;if(!saved)throw Error('保存結果を取得できませんでした');if(editingId){const i=cards.findIndex(c=>c.id===editingId);if(i>=0)cards[i]=saved;else cards.unshift(saved)}else{cards=cards.filter(c=>c.id!==saved.id);cards.unshift(saved)}dlg.close();reset();render()}catch(e){$('#status').textContent='エラー：'+e.message}finally{form.classList.remove('busy')}};
async function remove(c){if(!confirm(`「${c.name}」を削除しますか？`))return;try{const r=await fetch(API+'/card',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:c.id})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'削除できませんでした');cards=cards.filter(x=>x.id!==c.id);render()}catch(e){alert('エラー：'+e.message)}}
$('#add').onclick=openAdd;$('#cancel').onclick=()=>dlg.close();$('#search').oninput=render;$('#sort').onchange=render;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{filter=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));render()});$('#gallery').onclick=()=>{view='gallery';localStorage.setItem('tc-view',view);render()};$('#list').onclick=()=>{view='list';localStorage.setItem('tc-view',view);render()};load();
</script>
</body>
</html>
